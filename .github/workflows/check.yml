name: Check

# The gate for every change. Runs the same `npm run check` used locally: theme
# fingerprint, contrast audits, icon-theme validation, typecheck, lint, format and the
# settings tests.
#
# It deliberately builds from a clean checkout with nothing generated. themes/, icons/,
# dist/ and src/generated.ts are all gitignored, so this is what proves the repo is
# self-sufficient — a missing source file would fail here rather than after release.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# One in-flight run per branch: a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The extension writes files into its own install directory at runtime, so path handling
    # has to hold on Windows too. Linux alone would never catch a separator bug.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs the package-contents assertion too, so a file that leaks into the vsix fails
      # here and locally in exactly the same way.
      - name: Check
        run: npm run check

      # Packaging is part of the contract: .vscodeignore excluding a file the build
      # produced looks fine in the repo and is missing from the vsix.
      - name: Package
        shell: bash
        run: npx vsce package --no-dependencies --out chromaleon.vsix

      - name: Verify the packaged extension
        shell: bash
        run: |
          mkdir -p .verify
          unzip -q chromaleon.vsix -d .verify
          node test/settings.cjs .verify/extension

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: chromaleon-vsix
          path: chromaleon.vsix
          retention-days: 14

  # The check above runs on the tip of the branch, so a commit in the middle of a series can
  # fail its own suite and nothing notices. That is exactly what splitting a change risks:
  # tests landing one commit later than the behaviour they cover.
  history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check every commit in the pull request
        run: npm run check:history origin/${{ github.base_ref }}..HEAD
