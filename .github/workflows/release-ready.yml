# Merging into main publishes, so a release that was going to fail should fail while it is
# still a pull request somebody can fix, rather than as a red run against main.
#
# `skip release` turns all of this off, because that label means the merge is not a release and
# none of these questions apply to it.
name: release-ready

on:
  pull_request:
    branches: [main]
    # labeled and unlabeled matter: adding `skip release` has to re-run this, or the pull
    # request keeps a red check it can never clear.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the release is ready to cut
        env:
          GH_TOKEN: ${{ github.token }}
          SKIPPED: ${{ contains(github.event.pull_request.labels.*.name, 'skip release') }}
        shell: bash
        run: |
          if [[ "${SKIPPED}" == "true" ]]; then
            echo "::notice::skip release is on this pull request, so it is not a release"
            exit 0
          fi

          VERSION=$(node -p "require('./package.json').version")
          BASE=$(git show "origin/${GITHUB_BASE_REF}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          echo "main is on ${BASE}, this pull request is on ${VERSION}"

          FAILED=0

          # Equal means somebody forgot, lower means a bad merge. Neither can be published.
          if ! node -e "
            const [next, base] = process.argv.slice(1).map((value) => value.split('.').map(Number))
            for (let index = 0; index < 3; index += 1) {
              if (next[index] !== base[index]) process.exit(next[index] > base[index] ? 0 : 1)
            }
            process.exit(1)
          " "${VERSION}" "${BASE}"; then
            echo "::error::package.json is ${VERSION}, which is not above ${BASE}. Run npm run release <x.y.z>, or add the skip release label."
            FAILED=1
          fi

          if ! grep -qE "^## \[${VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [${VERSION}] - YYYY-MM-DD' heading."
            FAILED=1
          fi

          # npm run release empties it. Entries still sitting here mean the changelog is missing
          # something that is about to ship.
          if grep -qE '^\s+- \S' devlog.txt; then
            echo "::error::devlog.txt still has entries, so they are not in the changelog."
            FAILED=1
          fi

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::v${VERSION} has already been released. Pick a higher version."
            FAILED=1
          fi

          if [[ "${FAILED}" == "1" ]]; then
            exit 1
          fi
          echo "ready to release ${VERSION}"
