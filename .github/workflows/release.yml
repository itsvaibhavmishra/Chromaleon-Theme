# Merging staging into main is the release. The version bump is the human decision, made in
# that pull request and guarded by release-ready.yml; everything after it happens here.
#
# staging publishes nothing. It is where finished work waits, and `npm run package` gives you
# an installable build in seconds if you want to try something before it ships.
name: release

on:
  push:
    branches: [main]
    # A tag pushed by hand still releases, which is the way to retry or to ship from a commit
    # that never went through a pull request.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to release from'
        required: true
        default: 'main'

# Two releases racing would fight over the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Only to read back the labels on the pull request a commit came from.
  pull-requests: read

jobs:
  # A merge into main publishes by default, because that is what merging a release pull request
  # means. Opting out is a decision made on the pull request, so the `skip release` label is the
  # way to say it and it is visible before the merge rather than typed during one.
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "a tag or a manual run is an explicit request to publish"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${MESSAGE}" == *"[skip release]"* ]]; then
            echo "the commit says [skip release]"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fails open on purpose: a direct push has no pull request, and an API that is having
          # a bad day should cost a build nobody wanted rather than lose one somebody did.
          LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[].labels[].name] | join(",")' 2>/dev/null || echo '')
          echo "labels on the pull request for this commit: ${LABELS:-none}"

          if [[ ",${LABELS}," == *",skip release,"* ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The notes come out of the changelog, which needs the history the tag sits in.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nothing else has checked this exact commit, and it is the one people will install.
      # themes/, icons/ and dist/ are gitignored, so this is also what produces them.
      - run: npm run check

      - name: Work out what is being released
        id: what
        shell: bash
        run: |
          MANIFEST=$(node -p "require('./package.json').version")
          RELEASING="${GITHUB_REF}"
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] && RELEASING="refs/tags/v${MANIFEST}"

          if [[ "${RELEASING}" == refs/tags/* ]]; then
            TAG="${RELEASING#refs/tags/}"
            # The tag and the manifest disagreeing means one of them is a mistake, and
            # publishing either would be wrong.
            if [[ "v${MANIFEST}" != "${TAG}" ]]; then
              echo "::error::tag ${TAG} does not match package.json ${MANIFEST}"
              exit 1
            fi
          else
            # A merge into main. The manifest is the version, and the tag follows from it.
            TAG="v${MANIFEST}"
          fi

          echo "version=${MANIFEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # A re-run, or a merge that was never meant to be a release, is not a failure: the
          # release it would have made already exists.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} has already been released, nothing to do"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package
        if: steps.what.outputs.done == 'false'
        shell: bash
        run: npx vsce package --no-dependencies --out chromaleon-${{ steps.what.outputs.version }}.vsix

      # Packaging silently dropping a file is the failure this catches, and it has happened.
      - name: Verify the packaged extension
        if: steps.what.outputs.done == 'false'
        shell: bash
        run: |
          mkdir -p .verify
          unzip -q chromaleon-${{ steps.what.outputs.version }}.vsix -d .verify
          node test/settings.cjs .verify/extension

      - name: Take the notes from the changelog
        if: steps.what.outputs.done == 'false'
        shell: bash
        run: |
          # Everything under this version's heading, up to the next one.
          awk -v version="## [${{ steps.what.outputs.version }}]" '
            index($0, version) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

      # Creates the tag at this commit when one does not exist, which is what a merge into main
      # relies on. A tag pushed by GITHUB_TOKEN does not trigger workflows, so this cannot
      # re-enter the job through the tag trigger.
      - name: Publish the release
        if: steps.what.outputs.done == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.what.outputs.tag }}" \
            chromaleon-${{ steps.what.outputs.version }}.vsix \
            --title "Chromaleon ${{ steps.what.outputs.version }}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}"

      # Last, because it is the only step here that cannot be taken back. A version the
      # marketplace has accepted can never be replaced, only superseded by the next one, so
      # everything that is allowed to fail fails before this runs.
      #
      # Inert until VSCE_PAT exists. Publishing by hand through the Update path on the listing
      # is the current route, and this starts working the day the secret is added.
      - name: Publish to the marketplace
        if: steps.what.outputs.done == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [[ -z "${VSCE_PAT}" ]]; then
            echo "::notice::VSCE_PAT is not set, so ${{ steps.what.outputs.tag }} was published to GitHub only"
            exit 0
          fi
          # The same bytes the release carries, rather than a fresh package of the same commit.
          npx vsce publish --packagePath chromaleon-${{ steps.what.outputs.version }}.vsix
