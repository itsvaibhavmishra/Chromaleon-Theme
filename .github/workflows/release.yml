# Releases are cut by tagging main, never by a merge. A merge is somebody finishing a thought;
# a release is a decision, and the two should not be the same gesture.
#
# A push to staging publishes a pre-release instead, so there is always an installable build of
# what is coming without touching main or spending a version number on it.
name: release

on:
  push:
    tags: ['v*']
    branches: [staging]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate every commit passes. A tag is not a reason to skip it.
      - run: npm run check

      - name: Work out what is being released
        id: what
        shell: bash
        run: |
          MANIFEST=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # The tag and the manifest disagreeing means one of them is a mistake, and
            # publishing either would be wrong.
            if [[ "v${MANIFEST}" != "${TAG}" ]]; then
              echo "::error::tag ${TAG} does not match package.json ${MANIFEST}"
              exit 1
            fi
            echo "version=${MANIFEST}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            VERSION="${MANIFEST}-beta.${GITHUB_RUN_NUMBER}"
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        shell: bash
        run: npx vsce package --no-dependencies --out chromaleon-${{ steps.what.outputs.version }}.vsix

      # Packaging silently dropping a file is the failure this catches, and it has happened.
      - name: Verify the packaged extension
        shell: bash
        run: |
          mkdir -p .verify
          unzip -q chromaleon-${{ steps.what.outputs.version }}.vsix -d .verify
          node test/settings.cjs .verify/extension

      - name: Take the notes from the changelog
        id: notes
        shell: bash
        run: |
          if [[ "${{ steps.what.outputs.prerelease }}" == "false" ]]; then
            # Everything under this version's heading, up to the next one.
            awk -v version="## [${{ steps.what.outputs.version }}]" '
              index($0, version) == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md > notes.md
          else
            {
              echo "A build of \`staging\`, ahead of the next release."
              echo
              echo "Install it with **Extensions: Install from VSIX**. What is in it:"
              echo
              sed -e 's/^  //' -e '/^#/d' devlog.txt
            } > notes.md
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          FLAGS=()
          [[ "${{ steps.what.outputs.prerelease }}" == "true" ]] && FLAGS+=(--prerelease)
          gh release create "${{ steps.what.outputs.tag }}" \
            chromaleon-${{ steps.what.outputs.version }}.vsix \
            --title "Chromaleon ${{ steps.what.outputs.version }}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}" \
            "${FLAGS[@]}"
